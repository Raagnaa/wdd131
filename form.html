<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit product reviews with ratings, installation date, and useful features.">
    <meta name="author" content="Emmanuel Garcia" <title>Product Review</title>
    <link rel="stylesheet" href="styles/form.css">
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a product</option>
                <option value="flux capacitor">Flux Capacitor</option>
                <option value="power laces">Power Laces</option>
                <option value="time circuits">Time Circuits</option>
                <option value="low voltage reactor">Low Voltage Reactor</option>
                <option value="warp equalizer">Warp Equalizer</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>
                <label for="rating1">☆</label>
                <input type="radio" id="rating1" name="rating" value="1" required>
                <label for="rating1">☆☆</label>
                <input type="radio" id="rating2" name="rating" value="2" required>
                <label for="rating1">☆☆☆</label>
                <input type="radio" id="rating3" name="rating" value="3" required>
                <label for="rating1">☆☆☆☆</label>
                <input type="radio" id="rating4" name="rating" value="4" required>
                <label for="rating1">☆☆☆☆☆</label>
                <input type="radio" id="rating5" name="rating" value="5" required>
            </fieldset>

            <label for="installDate">Dato of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Which features did you find useful?</legend>
                <label><input type="checkbox" id="durability" name="features" value="Durability"> Durability</label>
                <label><input type="checkbox" id="ease" name="features" value="Ease of Use"> Ease of Use</label>
                <label><input type="checkbox" id="performance" name="features" value="Performance"> Performance</label>
                <label><input type="checkbox" id="design" name="features" value="Design"> Design</label>
            </fieldset>

            <label for="review">Written Review (Optional)</label>
            <textarea name="review" id="review"></textarea>

            <label for="username">Your Name (Optional)</label>
            <input type="text" id="username" name="username">

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>©2026 Product Review Assignment</p>
    </footer>

</body>

</html>
